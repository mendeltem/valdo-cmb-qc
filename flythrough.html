<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CMB Pipeline Flythrough</title>
<!-- Standalone file for the lecture: three.js r128 (MIT) embedded, runs offline by double-click. Image: VALDO 2021 Task 2 (CC BY-NC-SA 4.0). Keys: -> or clicker = next sub-step, <- back, space = continuous play, F full screen, P talk mode, H step mode on/off, A axial/3D. -->
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: one full-height stage; captions dock at the bottom, controls at the top-right */
:root{
  --bg:#0b1020; --panel:#121a30; --fg:#e8ecf7; --muted:#94a0c2; --line:#26325a;
  --accent:#ffb347; --ok:#4ade80; --bad:#f87171; --csf:#22d3ee; --ref:#60a5fa;
  --display:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#0b1020; --panel:#121a30; --fg:#e8ecf7; --muted:#94a0c2; --line:#26325a; color-scheme:dark } }
:root[data-theme="light"]{ --bg:#0b1020; --panel:#121a30; --fg:#e8ecf7; --muted:#94a0c2; --line:#26325a; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--display);overflow:hidden}
#stage{position:absolute;inset:0}
canvas{display:block}
#top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none}
#top h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
#top .sub{color:var(--muted);font-size:13px;margin-top:2px}
#ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
button{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:#1a1200;border-color:var(--accent)}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;pointer-events:none}
#steps{display:flex;gap:4px;pointer-events:auto;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
#steps button{flex:0 0 auto;padding:4px 8px;font-family:var(--mono);font-size:12px;border-radius:4px}
#steps button.cur{background:var(--accent);color:#1a1200;border-color:var(--accent)}
#steps button.done{border-color:#3b4c80}
#cap{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-width:760px;pointer-events:auto;backdrop-filter:blur(6px)}
#cap .k{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
#cap h2{margin:2px 0 6px;font-size:18px;font-weight:600;text-wrap:balance}
#cap p{margin:0;color:var(--fg);max-width:65ch}
#cap .m{margin-top:6px;color:var(--muted);font-size:13px;font-family:var(--mono)}
#bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;max-width:760px}
#bar i{display:block;height:100%;width:0;background:var(--accent)}
#hint{position:absolute;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:12px;text-align:right;pointer-events:none}
body.talk #cap{max-width:1100px;padding:18px 22px;font-size:20px}body.talk #cap h2{font-size:30px}body.talk #cap .k{font-size:15px}body.talk #cap .m{font-size:17px}body.talk #cap p{max-width:60ch}
body.talk #steps,body.talk #hint,body.talk #top .sub{display:none}body.talk #top h1{font-size:22px}body.talk #bar{max-width:1100px;height:6px}
#holdmark{display:none;font-family:var(--mono);font-size:13px;color:var(--accent);margin-top:6px}body.held #holdmark{display:block}
@media (max-width:640px){#top{flex-direction:column}#ctl{justify-content:flex-start}#hint{display:none}#cap h2{font-size:16px}}
@media (prefers-reduced-motion: reduce){#bar i{transition:none}}
</style>

<div id="stage"></div>
<div id="top">
  <div><h1 id="t1">CMB Pipeline Flythrough</h1><div class="sub" id="t2">One T2* volume travelling through the ten stations of the microbleed chain</div></div>
  <div id="ctl">
    <button id="play" aria-pressed="true" title="space">⏸ Pause</button>
    <button id="prev" title="←">◀ step</button>
    <button id="next" title="→">step ▶</button>
    <button id="speed" title="speed">1×</button>
    <button id="view" title="A: view">view: 3D</button>
    <button id="hold" aria-pressed="true" title="H: step mode — → plays one of four sub-steps and stops, ← goes back one; off = continuous play">⏯ Step mode</button>
    <button id="talk" aria-pressed="false" title="P: large captions, fewer controls">Talk mode</button>
    <button id="fs" title="F: full screen">⛶</button>
  </div>
</div>
<div id="hint">→ / clicker = next sub-step · ← back · space = continuous play · A axial/3D · F full screen · P talk mode</div>
<div id="bottom">
  <div id="steps"></div>
  <div id="cap"><div class="k" id="ck"></div><h2 id="ch"></h2><p id="cp"></p><div class="m" id="cm"></div><div id="holdmark"></div></div>
  <div id="bar"><i id="barfill"></i></div>
</div>

   ['Zweiter Kanal','Schnelle radiale Symmetrie (FRST)','Mikroblutungen sind kleine runde dunkle Punkte. Die FRST-Antwort (vier Radien 2 / 3 / 4 / 6 Voxel, eine feste Skala je Volumen) betont genau solche Punkte und geht als zweiter Kanal mit hinein.','FRST · Radien 2/3/4/6 vx'],
   ['Netz','Anisotropes 3D U-Net, 22,5 M Parameter','In der Arena gewählt: 32 Basiskanäle, vier Pooling-Stufen, InstanceNorm, LeakyReLU, transponierte Faltungen, ein Sigmoid-Ausgang. Die erste Stufe faltet und poolt nur in der Schicht (1 × 3 × 3), ab der zweiten ist das Gitter 1 mm isotrop.','32 → 64 → 128 → 256 → 512 Kanäle'],
   ['Trainingsrezept','800 Patches je Epoche, 60 Epochen','Patches von 2 × 38 × 62 × 94 Voxeln, Stapel 4: 60 % um eine Mikroblutung zentriert (jede Läsion gleich wahrscheinlich), 25 % zufällig im Hirn, 15 % irgendwo. Zufällige Spiegelungen als einzige Augmentierung. 60 feste Epochen, kein frühes Stoppen.','60 % / 25 % / 15 % · Batch 4'],
   ['Inferenz','Gleitendes Fenster, Mittel aus zwei Seeds','Fenster in Trainingsgröße mit halbem Versatz, überlappende Vorhersagen gemittelt, Fenster außerhalb des Hirns übersprungen. Die Karte ist das Mittel zweier Netze mit verschiedenen Startwerten.','halber Versatz · 2 Seeds'],
   ['Nachverarbeitung','Ein fester Arbeitspunkt und eine anatomische Regel','Schwelle 0,3, 26-verbundene Komponenten. Weg fallen Komponenten unter 2 mm³ oder über 2100 Voxel (10-mm-Kugel) und solche, deren Mehrheitslabel Ventrikel oder äußerer Liquor ist. Kein einstellbarer Parameter.','0,3 · ≥ 2 mm³ · ≤ 2100 vx · Liquor-Regel'],
   ['Zweite Stufe','Ein Klassifikator sieht jeden Kandidaten noch einmal','Nur auf SWI bestätigt: Kandidaten ab 0,15 / 1 mm³ ohne Liquor-Regel; ein kleines 3D-CNN (16 / 32 / 64 Kanäle, 0,22 M Parameter) sieht Bild, FRST und Wahrscheinlichkeit um jeden Kandidaten und entscheidet.','3D-CNN · 0,22 M Parameter · nur SWI'],
   ['Ausgabe','Maske und Liste der Läsionen','Heraus kommen die binäre Maske auf dem Gitter und eine Liste je Läsion: Volumen, Lage, Wahrscheinlichkeit. Das ist, was der Betrachter zeigt und die Metrik zählt.','Maske + Tabelle'],

   ['Intensity','Bias field removed, then an inverted scale','FSL FAST -B corrects the slow coil shading once per case. Then the image is put on 1 − I / max(I) inside the mask: microbleeds become bright.','FSL FAST -B · 1 − I/max(I)'],
   ['One grid','0.5 × 0.5 × 1.0 mm for every case, cropped to the brain','Every case lands on the same physical grid (image linear, label nearest neighbour, centre of the field of view preserved) and is cropped to the bounding box of the brain.','0.5 × 0.5 × 1.0 mm · bounding box'],
   ['Second channel','Fast radial symmetry (FRST)','Microbleeds are small round dark dots. The FRST response (four radii 2 / 3 / 4 / 6 voxels, one fixed scale per volume) highlights exactly such dots and enters as a second channel.','FRST · radii 2/3/4/6 vx'],
   ['Network','Anisotropic 3D U-Net, 22.5 M parameters','Chosen in the arena: 32 base channels, four poolings, InstanceNorm, LeakyReLU, transposed convolutions, one sigmoid output. The first level convolves and pools in-plane only (1 × 3 × 3); from the second level on the grid is 1 mm isotropic.','32 → 64 → 128 → 256 → 512 channels'],
   ['Training recipe','800 patches per epoch, 60 epochs','Patches of 2 × 38 × 62 × 94 voxels, batch 4: 60 % centred on a microbleed (each lesion equally likely), 25 % random brain, 15 % anywhere. Random flips as the only augmentation. 60 fixed epochs, no early stopping.','60 % / 25 % / 15 % · batch 4'],
   ['Inference','Sliding window, mean of two seeds','Windows of the training size with half-window stride, overlapping predictions averaged, windows outside the brain skipped. The map is the mean of two networks with different seeds.','half stride · 2 seeds'],

   ['Second stage','A classifier looks at every candidate again','Confirmed on SWI only: candidates from 0.15 / 1 mm³ without the CSF rule; a small 3D CNN (16 / 32 / 64 channels, 0.22 M parameters) sees image, FRST and probability around each candidate and decides. The classic false alarm is a vessel seen end-on: a dark dot in one slice that continues through the neighbouring slices, which only a 3D view reveals.','3D CNN · 0.22 M parameters · SWI only · vessel = false alarm'],

function makeStack(n, h, kind, base){   // base: 'inv' (image under an overlay), 'dark' (black backing) or null
  const g = new THREE.Group(); const mid = Math.floor(n/2); const geo = new THREE.PlaneGeometry(TW, TD); const edge = new THREE.EdgesGeometry(geo);
  for (let i=0;i<n;i++){ const y = -h/2 + i/(n-1)*h;
    if (i === mid) {
      if (base) { const u = new THREE.Mesh(geo, base === 'dark' ? new THREE.MeshBasicMaterial({color:0x0b1020, transparent:true, opacity:0.95, side:THREE.DoubleSide}) : new THREE.MeshBasicMaterial({map:REALTEX[base], transparent:true, opacity:1, side:THREE.DoubleSide, depthWrite:false})); u.rotation.x = -Math.PI/2; u.position.y = y - 0.004; u.userData.under = true; g.add(u); }

    } else {
      const l = new THREE.LineSegments(edge, new THREE.LineBasicMaterial({color:0x8fa3d9, transparent:true, opacity:0.35})); l.rotation.x = -Math.PI/2; l.position.y = y; l.userData.sym = true; g.add(l);
    }
  }
  g.userData = Object.assign(g.userData, {n, h, kind});

}

// patches (station 6)

// ------------------------------------------------------------------ timeline
const DUR = [7, 9, 8, 7.5, 12, 11, 10, 12, 14, 21];   // seconds per station at 1x; in step mode each station is walked in SUB sub-steps
const SUB = 4;   // seconds per station at 1x
const total = DUR.reduce((a,b)=>a+b,0);
let time = 0, playing = true, speed = 1, last = performance.now(); let hold = true, held = false, playTo = null;
try { hold = localStorage.getItem('cmbfly_hold') !== '0'; } catch(e){}
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduced) playing = false;
const ease = t => t<0.5 ? 2*t*t : -1+(4-2*t)*t;
const clamp01 = v => Math.max(0, Math.min(1, v));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
function stepAt(time){ let acc = 0; for (let i=0;i<N;i++){ if (time < acc + DUR[i]) return [i, (time-acc)/DUR[i]]; acc += DUR[i]; } return [N-1, 1]; }

let cur = -1;
scene.traverse(o => { if (o.material && o.material.transparent) o.material.depthWrite = false; });
function hideInvisible(){ scene.traverse(o => { if (o.material && o.material.transparent && !o.isSprite && o.type !== 'Scene') o.visible = (o.material.opacity > 0.01) && (!o.parent || o.parent.visible !== false); }); }
function render(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (playing) {
    const [i0] = stepAt(time); const end = DUR.slice(0, i0+1).reduce((a,b)=>a+b,0) - 0.001;
    time += dt * speed;
    if (playTo !== null && time >= playTo) { time = playTo; playTo = null; playing = false; held = true; updatePlayBtn(); }
    else if (hold && time >= end) { time = end; playing = false; held = true; updatePlayBtn(); }
    if (time >= total) { time = total - 0.001; playing = false; held = true; updatePlayBtn(); }
  }
  const [i, t] = stepAt(time);
  if (i !== cur) { cur = i; caption(i); }
  // volume position: travels between stations during the first 25 % of each step
  const travel = ease(seg(t, 0, 0.25));
  const x = (i === 0) ? stationX(0) : stationX(i-1) + (stationX(i) - stationX(i-1)) * travel;
  vol.position.set(x, 0.3 + Math.sin(now/900)*0.06, 0);
  const tt = seg(t, 0.25, 1);  // local progress after arrival
  drawStep(i, tt, t);
  // camera
  const target = new THREE.Vector3(x + (i===4 ? 1.2 : i===5 ? 1.6 : 0.9), 0.3, 0); const wide = (view === 'axial') ? ((i === 3) ? 1.35 : (i === 4) ? 1.9 : (i === 5) ? 1.6 : 1) : ((i === 4 || i === 5) ? 1.3 : 1);
  const orbit = new THREE.Vector3(Math.sin(orb.yaw)*Math.cos(orb.pitch), Math.sin(orb.pitch), Math.cos(orb.yaw)*Math.cos(orb.pitch)).multiplyScalar(orb.dist * wide);
  camera.position.lerp(target.clone().add(orbit), 0.08); camera.up.set(0, view==='axial' ? 0 : 1, view==='axial' ? -1 : 0); camera.lookAt(target);
  // station rings: current one glows
  document.getElementById('barfill').style.width = (time/total*100).toFixed(2) + '%';
  hideInvisible(); renderer.render(scene, camera);
  requestAnimationFrame(render);
}

function drawStep(i, u, raw){

    // the real stack flies in and fades as the first block appears

    fine.position.set(-7.5 + (encB[0].position.x + 7.5)*sh, encB[0].position.y*sh, 0); frst.position.set(fine.position.x + 0.3, fine.position.y, 0.3);
    setStackOpacity(fine, 0.9*(1-enter)); setStackOpacity(frst, 0.9*(1-enter));
    const pos = walk * (nodes.length - 1); const a = Math.min(nodes.length - 2, Math.floor(pos)), f = pos - a;
    const la = lvlOf(a), lb = lvlOf(a + 1); const lvl = f < 0.5 ? la : lb; const sp = SPATIAL[la] + (SPATIAL[lb] - SPATIAL[la]) * ease(f);
    const P = nodes[a].clone().lerp(nodes[a+1], ease(f)); feat.position.set(unet.position.x + P.x, P.y + 0.25, P.z);

    box.material.opacity = 0; maskShell.material.opacity = 0;
    prob.visible = leave > 0; setStackOpacity(prob, 0.9*leave); prob.position.set(decB[0].position.x + 1.2 + 5.0*leave, 0, 0); probLab.position.set(vol.position.x + prob.position.x, vol.position.y + 0.6, vol.position.z - TD*0.5 - 2.4); probLab.material.opacity = leave; return; }
  if (i === 5) { // training: real slices go one by one into the U-Net, the output lands next to its label, the loss falls; then candidate patches train the 3D CNN
    const o = fadeIn(seg(u, 0, 0.1)); const n = TRAIN.length; const nP = patchTiles.length;
    unetBlock.material.opacity = o; unetBlockLab.material.opacity = o; lossBar.material.opacity = o; lossLab.material.opacity = o;
    const phaseA = seg(u, 0.1, 0.72), phaseB = seg(u, 0.74, 1.0);
    const ep = Math.min(60, Math.round(1 + 59 * u)); const loss = 0.9 * Math.exp(-3.2 * u) + 0.06; lossBar.scale.x = Math.max(0.03, loss); lossBar.position.x = -0.5 + loss / 2;
    setLossLabel(`epoch ${ep} / 60 · loss ${loss.toFixed(2)} · 800 patches per epoch`);
    TRAIN.forEach((t, q) => {
      const h = TT_W * t.h / t.w; const a = q / n, b = (q + 1) / n; const k = seg(phaseA, a, b);        // this tile's turn
      const row = -3.6 + q * 1.45;                                                                  // queue of inputs on the left, bottom row
      const fly = ease(seg(k, 0, 0.45)); const outK = seg(k, 0.5, 1);
      const pIn = new THREE.Vector3(row - 1.5, -1.6, 1.2).lerp(unetBlock.position, fly);

      const home = new THREE.Vector3(2.2 + (q % 3) * 0.5, -1.2 - Math.floor(q / 3) * 0.5, 1.0); const P = home.clone().lerp(cnnBlock.position, fly * (1 - back)); g.position.copy(P);
      tileOpacity(g, o * fadeIn(phaseB * 4)); const c = k > 0.5 ? (g.userData.kind === 'true' ? 0x4ade80 : 0xf87171) : 0x8fa3d9; g.children[1].material.color.set(c);
      cnnBlock.material.emissiveIntensity = (k > 0.4 && k < 0.6) ? 1.2 : 0.3; });
    fine.visible = false; box.material.opacity = 0; vol.position.y = 0.3; return; }
  if (i === 6) { fine.visible = true; box.material.opacity = 0.7; box.scale.set(0.86,1,0.86); const k = seg(u, 0.05, 0.75); const steps = 12; const s = Math.floor(k*steps), f = k*steps - s; const col = s % 4, row = Math.floor(s/4); win.position.set(-1.2 + col*0.8, -0.9 + row*0.9, -1.4 + (f*2.6)); win.material.opacity = k < 1 ? 0.9 : 0; ghost.position.copy(win.position); ghost.material.opacity = k<1 ? 0.12 : 0; const m = seg(u, 0.75, 1); prob.visible = m > 0; setStackOpacity(prob, 0.9*m); setStackOpacity(fine, 0.9*(1-m)); probLab.position.set(vol.position.x + 0.9, vol.position.y + 0.6, vol.position.z - TD*0.5 - 2.4); probLab.material.opacity = m; return; }
  if (i === 7) { prob.visible = u < 0.3; setStackOpacity(prob, 0.9*(1-seg(u,0.1,0.3))); probLab.position.set(vol.position.x + 0.9, vol.position.y + 0.6, vol.position.z - TD*0.5 - 2.4); probLab.material.opacity = 1-seg(u,0.1,0.3); csf.visible = u > 0.55; setStackOpacity(csf, 0.6*seg(u,0.55,0.75)*(1-seg(u,0.92,1))); box.material.opacity = 0.5; box.scale.set(0.86,1,0.86);
    fine.visible = true; setStackOpacity(fine, 0.9);
    spheres.forEach(s => { const o = fadeIn(seg(u,0.15,0.3)); const pulse = 1 + 0.15*Math.sin(u*40); s.mesh.material.opacity = o; s.mesh.scale.set(pulse,pulse,pulse); }); vesselMark.material.opacity = 0.9 * fadeIn(seg(u, 0.5, 0.7)); return; }
  if (i === 8) { // second stage: each candidate (image, FRST, probability around it) goes into the 3D CNN; a microbleed comes back green, the vessel red
    box.material.opacity = 0.5; box.scale.set(0.86,1,0.86); fine.visible = true; setStackOpacity(fine, 0.9); vesselMark.material.opacity = 0.9;
    const o = fadeIn(seg(u,0,0.12)); cnn.material.opacity = o; cnnLab.material.opacity = o;
    const cands = spheres.filter(s => s.kind==='tp' || s.kind==='fp'); const order = cands.slice().sort((a, b) => (a.kind === 'fp') - (b.kind === 'fp'));   // true ones first, the vessel last
    const per = 0.82 / order.length;
    order.forEach((s,q) => { const a = 0.12 + q*per, b = a + per; const k = seg(u, a, b); const home = s.mesh.userData.home; const goal = cnn.position.clone().sub(vol.position);
      const back = k > 0.5 ? (k-0.5)*2 : 0; const go = k <= 0.5 ? k*2 : 1; s.mesh.position.copy(home.clone().lerp(goal, ease(go)*(1-ease(back)))); s.mesh.material.opacity = 1;
      if (k > 0.5) { const c = s.kind === 'tp' ? 0x4ade80 : 0xf87171; s.mesh.material.color.set(c); s.mesh.material.emissive.set(c); if (s.kind === 'fp') { s.mesh.material.opacity = 1 - back; vesselMark.material.opacity = 0.9 * (1 - back); } }
      cnn.material.emissiveIntensity = (k>0.4 && k<0.6) ? 1.2 : 0.3;
      // crop stacks: the first true candidate and the vessel show their nine neighbouring slices while they are inspected
      const show = fadeIn(seg(k, 0.15, 0.3)) * (1 - seg(k, 0.9, 1)); const g = s.kind === 'fp' ? cropFP : (q === 0 ? cropTP : null); const lab = s.kind === 'fp' ? cropLabFP : (q === 0 ? cropLabTP : null);
      if (g) { g.position.set(cnn.position.x + 1.6, cnn.position.y - 0.2, cnn.position.z + 0.4); setCrop(g, show); lab.position.set(cnn.position.x + 1.6, cnn.position.y + 1.5, cnn.position.z + 0.4); lab.material.opacity = show; }
    }); return; }
  if (i === 9) { // output: every finding of this slice is inspected one by one (ring, its nine neighbouring slices, the reason), then mask and table
    mask.visible = true; setStackOpacity(mask, 0.9); box.material.opacity = 0.7; box.scale.set(0.86,1,0.86);
    spheres.filter(s=>s.kind==='tp').forEach(s => { s.mesh.material.color.set(0x4ade80); s.mesh.material.emissive.set(0x4ade80); s.mesh.material.opacity = 1; });
    const nC = COMP.length; const per = 0.78 / nC;

      const g = compStack[q]; g.position.set(vol.position.x + TW*0.5 + 1.3, vol.position.y + 0.3, vol.position.z - 0.6); g.children.forEach(ch => ch.material.opacity = show * (ch.type === 'LineSegments' ? 0.9 : 1));

}

// ------------------------------------------------------------------ UI
const stepsBox = document.getElementById('steps');
function buildStepButtons(){ stepsBox.innerHTML = ''; T[lang].steps.forEach((s,i) => { const b = document.createElement('button'); b.textContent = i + ' ' + s[0]; b.id = 'st'+i; b.onclick = () => jump(i); stepsBox.appendChild(b); }); }
function caption(i){ const s = T[lang].steps[i]; document.getElementById('ck').textContent = 'Station ' + i + ' / 9'; document.getElementById('ch').textContent = s[0] + ' · ' + s[1]; document.getElementById('cp').textContent = s[2]; document.getElementById('cm').textContent = s[3]; [...stepsBox.children].forEach((b,q) => { b.classList.toggle('cur', q===i); b.classList.toggle('done', q<i); }); try { document.getElementById('st'+i).scrollIntoView({inline:'center', block:'nearest', behavior: reduced ? 'auto' : 'smooth'}); } catch(e){} }
const startOf = i => DUR.slice(0,i).reduce((a,b)=>a+b,0);
function jump(i){ time = startOf(i) + 0.001; cur = -1; held = false; playing = true; playTo = hold ? startOf(i) + DUR[i] / SUB - 0.001 : null; updatePlayBtn(); }
function subOf(){ const [i, t] = stepAt(time); return [i, t, Math.min(SUB, Math.floor(t * SUB + 1e-4))]; }
function updatePlayBtn(){ const b = document.getElementById('play'); b.textContent = playing ? T[lang].pause : T[lang].play; b.setAttribute('aria-pressed', playing ? 'true' : 'false'); document.body.classList.toggle('held', held && !playing); const [si, st, sk] = subOf(); document.getElementById('holdmark').textContent = (sk >= SUB ? T[lang].held : `step ${sk} / ${SUB} of this station — → continues, ← back`); }
document.getElementById('play').onclick = () => { if (time >= total - 0.01) time = 0; playTo = null; held = false; playing = !playing; updatePlayBtn(); };   // continuous play, ignores the sub-steps
document.getElementById('prev').onclick = () => { const [i, t, k] = subOf(); if (hold && k >= 1 && t > 0.02) { time = startOf(i) + DUR[i] * (k - 1) / SUB + 0.001; playTo = null; playing = false; held = true; cur = -1; updatePlayBtn(); return; } jump(Math.max(0, i - (t < 0.15 ? 1 : 0))); };
document.getElementById('next').onclick = () => { const [i, t, k] = subOf(); if (hold) { if (playing && playTo !== null) { time = playTo; return; } if (k < SUB && t < 0.999) { playTo = startOf(i) + DUR[i] * (k + 1) / SUB - 0.001; held = false; playing = true; updatePlayBtn(); return; } } jump(Math.min(N-1, i + 1)); };
document.getElementById('hold').onclick = e => { hold = !hold; e.target.setAttribute('aria-pressed', hold ? 'true' : 'false'); try { localStorage.setItem('cmbfly_hold', hold ? '1' : '0'); } catch(err){} if (!hold && held) { held = false; playing = true; updatePlayBtn(); } };
document.getElementById('talk').onclick = e => { const on = document.body.classList.toggle('talk'); e.target.setAttribute('aria-pressed', on ? 'true' : 'false'); try { localStorage.setItem('cmbfly_talk', on ? '1' : '0'); } catch(err){} };
document.getElementById('fs').onclick = () => { const el = document.documentElement; if (document.fullscreenElement) { document.exitFullscreen && document.exitFullscreen(); } else if (el.requestFullscreen) { el.requestFullscreen().catch(()=>{}); } };
document.getElementById('speed').onclick = e => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; e.target.textContent = speed + '×'; };
function applyLang(){ const L = T[lang]; document.getElementById('t1').textContent = L.title; document.getElementById('t2').textContent = L.sub; document.getElementById('hint').textContent = L.hint; document.getElementById('hold').textContent = L.hold; document.getElementById('talk').textContent = L.talk; updateViewBtn(); document.getElementById('prev').textContent = '◀ ' + L.step; document.getElementById('next').textContent = L.step + ' ▶'; buildStepButtons(); placeStationLabels(); if (table) { scene.remove(table); table = null; } updatePlayBtn(); cur = -1; }
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); document.getElementById('play').click(); } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'ArrowDown') { e.preventDefault(); document.getElementById('next').click(); } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp') { e.preventDefault(); document.getElementById('prev').click(); } else if (e.key === 'f' || e.key === 'F') { document.getElementById('fs').click(); } else if (e.key === 'p' || e.key === 'P') { document.getElementById('talk').click(); } else if (e.key === 'h' || e.key === 'H') { document.getElementById('hold').click(); } else if (e.key === 'a' || e.key === 'A') { document.getElementById('view').click(); } else if (e.key === 'Home') { jump(0); } });

// orbit by drag, zoom by wheel
const VIEWS = {axial:{yaw:0.0, pitch:1.45, dist:8.5}, three:{yaw:0.55, pitch:0.32, dist:13}};
let view = 'axial'; try { view = localStorage.getItem('cmbfly_view') || 'axial'; } catch(e){}
const orb = Object.assign({}, VIEWS[view]);
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, yaw:orb.yaw, pitch:orb.pitch}; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', e => { if (!drag) return; orb.yaw = drag.yaw + (e.clientX - drag.x)*0.006; orb.pitch = Math.max(-0.2, Math.min(1.5, drag.pitch + (e.clientY - drag.y)*0.005)); });
document.getElementById('view').onclick = () => { view = view === 'axial' ? 'three' : 'axial'; Object.assign(orb, VIEWS[view]); try { localStorage.setItem('cmbfly_view', view); } catch(e){} updateViewBtn(); };
function updateViewBtn(){ document.getElementById('view').textContent = view === 'axial' ? T[lang].three : T[lang].axial; document.getElementById('view').title = view === 'axial' ? 'A: switch to the 3D view' : 'A: back to the axial view'; }
renderer.domElement.addEventListener('pointerup', () => drag = null); renderer.domElement.addEventListener('pointercancel', () => drag = null);
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); orb.dist = Math.max(4, Math.min(30, orb.dist * (e.deltaY > 0 ? 1.1 : 0.9))); }, {passive:false});
window.addEventListener('resize', () => { renderer.setSize(stage.clientWidth, stage.clientHeight); camera.aspect = stage.clientWidth/stage.clientHeight; camera.updateProjectionMatrix(); });

applyLang();
if (hold) playTo = DUR[0] / SUB - 0.001;
document.getElementById('hold').setAttribute('aria-pressed', hold ? 'true' : 'false');
try { if (localStorage.getItem('cmbfly_talk') === '1') { document.body.classList.add('talk'); document.getElementById('talk').setAttribute('aria-pressed','true'); } } catch(e){}
camera.position.set(stationX(0)+8, 5, 14);
requestAnimationFrame(render);
})();
</script>
